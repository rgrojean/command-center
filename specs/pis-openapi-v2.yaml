# Snapshot of identity_service/openapi.yaml at tag baseline-v2.
# Live diff prefers workspaces/identity_service/openapi.yaml when cloned.
# This copy exists so `npm run pipeline -- --stub` can run the real diff
# module with zero network.
openapi: 3.0.3
info:
  title: Riverbend Health Patient Identity Service
  version: "2.0.0"
  description: Patient Identity Service (PIS) v2 — internal hospital API contract.
servers:
  - url: http://localhost:4110
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /v2/patients/{patientId}:
    get:
      summary: Get patient by ID
      operationId: getPatientById
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Patient found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Patient not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /v2/patients:
    get:
      summary: Search or list patients
      operationId: listPatients
      parameters:
        - name: q
          in: query
          required: false
          description: Name substring search. When present, search mode is used.
          schema:
            type: string
        - name: facility
          in: query
          required: false
          description: Facility code for paged roster (RVB or SAM).
          schema:
            type: string
            enum: [RVB, SAM]
        - name: page
          in: query
          required: false
          description: Page number for facility roster (page size 10). Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Search or roster results
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SearchResponse"
                  - $ref: "#/components/schemas/RosterResponse"
components:
  schemas:
    Address:
      type: object
      required: [line1, city, state, zip]
      properties:
        line1:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
    Patient:
      type: object
      required:
        - patientId
        - name
        - dob
        - gender
        - ssn
        - phone
        - email
        - address
      properties:
        patientId:
          type: string
        name:
          type: string
          description: Single flat display name string (e.g. "Garcia, Maria").
        dob:
          type: string
          description: Date of birth in MM/DD/YYYY format.
        gender:
          type: string
        ssn:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        address:
          $ref: "#/components/schemas/Address"
    SearchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        meta:
          type: object
          required: [total]
          properties:
            total:
              type: integer
    RosterResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        meta:
          type: object
          required: [total, page, nextPage]
          properties:
            total:
              type: integer
            page:
              type: integer
            nextPage:
              type: integer
              nullable: true
